server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-response: true
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  application:
    name: jianda-backend
  datasource:
    url: jdbc:h2:file:./data/jianda;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 21MB
  jackson:
    default-property-inclusion: non_null
jianda:
  demo-content-enabled: ${JIANDA_DEMO_CONTENT_ENABLED:true}
  jwt-secret: ${JWT_SECRET:jianda-local-development-secret-must-be-at-least-32-bytes}
  jwt-expiration-hours: 12
  upload-dir: ${UPLOAD_DIR:./uploads}
  ai-service-url: ${AI_SERVICE_URL:http://127.0.0.1:8001}
  assistant:
    external-enabled: ${ASSISTANT_EXTERNAL_ENABLED:false}
  web-search:
    provider: ${WEB_SEARCH_PROVIDER:disabled}
    api-key: ${WEB_SEARCH_API_KEY:}
    endpoint: ${WEB_SEARCH_ENDPOINT:https://api.tavily.com/search}
  payment:
    provider: ${PAYMENT_PROVIDER:disabled}
    local-test-enabled: ${PAYMENT_LOCAL_TEST_ENABLED:false}
  public-fixture: ${JIANDA_PUBLIC_FIXTURE:}
  crawl:
    scheduler-enabled: ${CRAWL_SCHEDULER_ENABLED:false}
    daily-time: ${CRAWL_DAILY_TIME:03:30}
    timezone: ${CRAWL_TIMEZONE:Asia/Shanghai}
    max-articles-per-source: ${CRAWL_MAX_ARTICLES_PER_SOURCE:5}
    global-max-articles-per-run: ${CRAWL_GLOBAL_MAX_ARTICLES_PER_RUN:20}
    auto-ai-enabled: ${CRAWL_AUTO_AI_ENABLED:false}
    max-failure-retries: ${CRAWL_MAX_FAILURE_RETRIES:3}
    daily-ai-max-articles: ${CRAWL_DAILY_AI_MAX_ARTICLES:5}
    daily-ai-max-tokens: ${CRAWL_DAILY_AI_MAX_TOKENS:50000}
    ai-max-input-characters: ${CRAWL_AI_MAX_INPUT_CHARACTERS:50000}
    ai-max-articles-per-task: ${CRAWL_AI_MAX_ARTICLES_PER_TASK:5}
    ai-consumer-batch-size: ${CRAWL_AI_CONSUMER_BATCH_SIZE:2}
    ai-consumer-delay-ms: ${CRAWL_AI_CONSUMER_DELAY_MS:60000}
    web-image-candidates-enabled: ${WEB_IMAGE_CANDIDATES_ENABLED:true}
    historical-cover-backfill-enabled: ${HISTORICAL_COVER_BACKFILL_ENABLED:true}
  cors:
    allowed-origins: ${JIANDA_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5173,http://localhost:5174}
