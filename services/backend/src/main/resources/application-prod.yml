spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  h2:
    console:
      enabled: false

jianda:
  jwt-secret: ${JWT_SECRET}
  upload-dir: ${UPLOAD_DIR}
  ai-service-url: ${AI_SERVICE_URL}
  cors:
    allowed-origins: ${JIANDA_CORS_ALLOWED_ORIGINS}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
