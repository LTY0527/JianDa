server {
    listen 80;
    server_name _;
    root /usr/share/nginx/h5;
    index index.html;
    client_max_body_size 25m;

    location ~* \.mjs$ {
        default_type application/javascript;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # AMap JS API 2.0 security proxy. The security code is injected by the
    # container at runtime and is never compiled into the browser bundle.
    location /_AMapService/ {
        # Append the runtime secret during URI rewriting. Assigning $args in a
        # separate directive previously left jscode empty at the upstream.
        rewrite ^/_AMapService/(.*)$ /$1?jscode=${AMAP_SECURITY_JS_CODE} break;
        proxy_pass https://restapi.amap.com;
        proxy_ssl_server_name on;
        proxy_set_header Host restapi.amap.com;
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Vary Origin always;
    }

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}

