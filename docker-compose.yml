services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-jianda}
      MYSQL_USER: ${MYSQL_USER:-jianda}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-jianda_dev_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-jianda_root_dev_password}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - jianda_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
  ai-service:
    build: ./services/ai-service
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      EXTERNAL_LLM_BASE_URL: ${EXTERNAL_LLM_BASE_URL:-https://api.deepseek.com}
      EXTERNAL_LLM_API_KEY: ${EXTERNAL_LLM_API_KEY:-}
      EXTERNAL_LLM_MODEL: ${EXTERNAL_LLM_MODEL:-deepseek-v4-flash}
      EXTERNAL_LLM_TIMEOUT_SECONDS: ${EXTERNAL_LLM_TIMEOUT_SECONDS:-60}
      EXTERNAL_LLM_MAX_RETRIES: ${EXTERNAL_LLM_MAX_RETRIES:-2}
      EXTERNAL_LLM_MAX_TOKENS: ${EXTERNAL_LLM_MAX_TOKENS:-6000}
      EXTERNAL_LLM_THINKING: ${EXTERNAL_LLM_THINKING:-disabled}
      JIANDA_PROMPT_VERSION: ${JIANDA_PROMPT_VERSION:-v1.1}
      JIANDA_ALLOW_FAKE_IP_DNS: ${JIANDA_ALLOW_FAKE_IP_DNS:-false}
    ports:
      - "${AI_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
  backend:
    build: ./services/backend
    depends_on:
      mysql:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      DB_URL: ${DB_URL:-jdbc:mysql://mysql:3306/jianda?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
      DB_USERNAME: ${DB_USERNAME:-jianda}
      DB_PASSWORD: ${DB_PASSWORD:-jianda_dev_password}
      JWT_SECRET: ${JWT_SECRET:-jianda-compose-development-secret-change-in-production}
      UPLOAD_DIR: ${UPLOAD_DIR:-/app/uploads}
      AI_SERVICE_URL: ${AI_SERVICE_URL:-http://ai-service:8001}
      JIANDA_PUBLIC_FIXTURE: ${JIANDA_PUBLIC_FIXTURE:-}
      JIANDA_CORS_ALLOWED_ORIGINS: ${JIANDA_CORS_ALLOWED_ORIGINS:-http://127.0.0.1,http://127.0.0.1:8090,http://localhost,http://localhost:8090,http://127.0.0.1:5173,http://127.0.0.1:5174,http://localhost:5173,http://localhost:5174}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - jianda_uploads:/app/uploads
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_H5_BASE_URL: ${VITE_H5_BASE_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${H5_PORT:-80}:80"
      - "${INSTITUTION_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
volumes:
  jianda_mysql:
  jianda_uploads:
